<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eenheden123D</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>

<body>
    <main class="container app-container">
        <div class="row g-3 justify-content-center align-items-start">
            <div class="col-12 col-lg-3">
                <aside class="card timer-card text-center">
                    <div class="timer-card-icon">⏱</div>
                    <h2>Timer</h2>
                    <label for="timerSelect" class="form-label">Instellen</label>
                    <select id="timerSelect" class="form-select">
                        <option value="0">Uit</option>
                        <option value="15">15 sec</option>
                        <option value="30" selected>30 sec</option>
                        <option value="60">60 sec</option>
                    </select>
                    <strong id="timerDisplay" class="timer-display">--</strong>
                </aside>
            </div>

            <div class="col-12 col-md-10 col-lg-7">
                <article class="card converter-card">
                    <header class="card-header text-center">
                        <span class="app-mark">123D</span>
                        <h1>Eenheden123D</h1>
                        <p>Oefen met meten, oppervlakte en inhoud</p>
                    </header>

                    <div class="card-body">
                        <div class="score-row">
                            <div class="score-item score-good">
                                <span>Goed</span>
                                <strong id="correctScore">0</strong>
                            </div>
                            <div class="score-item score-wrong">
                                <span>Fout</span>
                                <strong id="wrongScore">0</strong>
                            </div>
                        </div>

                        <label for="dimensionSelect" class="form-label">Kies wat je wilt oefenen</label>
                        <select id="dimensionSelect" class="form-select converter-select" aria-label="Eenheidstype">
                            <option value="1D" selected>1D (lengte)</option>
                            <option value="2D">2D (oppervlakte)</option>
                            <option value="3D">3D (inhoud)</option>
                        </select>

                        <div class="equation-label">Reken om naar de gevraagde eenheid</div>
                        <div class="row g-2 align-items-center equation-row">
                            <div class="col-12 col-sm-5">
                                <input id="question" type="text" class="form-control text-center" aria-label="Vraag"
                                    disabled>
                            </div>
                            <div class="col-12 col-sm-1 equals">=</div>
                            <div class="col-12 col-sm-6">
                                <input id="answer" type="text" inputmode="decimal" class="form-control text-center"
                                    aria-label="" placeholder="">
                            </div>
                        </div>

                        <div id="targetUnit" class="target-unit" aria-live="polite"></div>
                        <div id="result" class="result" aria-live="polite"></div>

                        <div class="row g-2 converter-actions">
                            <div class="col-6">
                                <button id="newQuestionButton" type="button"
                                    class="btn btn-primary w-100">NIEUW</button>
                            </div>
                            <div class="col-6">
                                <button id="checkAnswerButton" type="button"
                                    class="btn btn-success w-100">CHECK</button>
                            </div>
                        </div>
                    </div>

                    <footer class="card-footer text-center">
                        <strong>Made by Majed</strong>
                    </footer>
                </article>
            </div>
        </div>
    </main>

    <script src="eenheden.js"></script>
</body>

</html>
